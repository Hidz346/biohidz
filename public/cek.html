<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cek sinkron project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6E5; --ink:#15130F;
    --yellow:#FFC93C; --pink:#FF5D8F; --cyan:#3EC1D3;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:24px 16px 48px;
    background:var(--cream); color:var(--ink);
    font-family:'Space Grotesk',sans-serif; line-height:1.55;
  }
  main{ max-width:560px; margin:0 auto; }
  h1{ font-family:'Orbitron',sans-serif; font-size:1.5rem; margin:0 0 8px; }
  .lead{ margin:0 0 20px; font-size:.9rem; opacity:.8; }
  .card{
    padding:18px 20px; margin-bottom:18px;
    background:#fff; border:3px solid var(--ink); box-shadow:6px 6px 0 var(--ink);
  }
  .card h2{ font-family:'Orbitron',sans-serif; font-size:1.05rem; margin:0 0 8px; }
  .card p{ margin:0 0 8px; font-size:.92rem; }
  .card p:last-child{ margin-bottom:0; }
  .card.ok{ background:var(--cyan); }
  .card.warn{ background:var(--yellow); }
  .card.bad{ background:var(--pink); }
  details{ margin-bottom:18px; }
  summary{ cursor:pointer; font-weight:600; margin-bottom:8px; }
  pre{
    margin:0; padding:14px; overflow-x:auto;
    background:var(--ink); color:var(--cream);
    font-size:.78rem; line-height:1.5;
  }
  button{
    padding:10px 18px; font:inherit; font-weight:700; color:var(--ink);
    background:var(--yellow); border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink);
    cursor:pointer;
  }
  button:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  :focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <h1>Cek sinkron project</h1>
  <p class="lead">Halaman ini memeriksa <code>/api/projects</code> dan menjelaskan hasilnya. Hapus <code>cek.html</code> dari repo kalau sudah tidak dipakai.</p>

  <section id="verdict" class="card" aria-live="polite">
    <h2>Memeriksa…</h2>
  </section>

  <details open>
    <summary>Data mentah</summary>
    <pre id="raw">-</pre>
  </details>

  <button type="button" id="again">Periksa lagi</button>
</main>

<script>
(function(){
  var verdictEl = document.getElementById('verdict');
  var rawEl = document.getElementById('raw');

  function show(tone, title, lines){
    verdictEl.className = 'card ' + tone;
    verdictEl.textContent = '';
    var h = document.createElement('h2');
    h.textContent = title;
    verdictEl.appendChild(h);
    lines.forEach(function(text){
      var p = document.createElement('p');
      p.textContent = text;
      verdictEl.appendChild(p);
    });
  }

  // Menerjemahkan hasil /api/projects jadi penjelasan + langkah berikutnya.
  function diagnose(status, contentType, text){
    var data = null;
    try { data = JSON.parse(text); } catch (err) {}

    if (!data || typeof data !== 'object'){
      if (status === 404){
        return ['bad', 'Fungsi tidak ditemukan (404)', [
          'Alamat /api/projects tidak ada di situs ini.',
          'Pastikan file ada di functions/api/projects.js pada root repo, lalu deploy ulang.'
        ]];
      }
      if (status === 200 && /^\s*<(!doctype|html)/i.test(text)){
        return ['bad', 'Fungsi belum terbaca', [
          'Cloudflare Pages menjawab dengan halaman biasa, bukan dengan data. Artinya file fungsi belum terdeteksi.',
          'Cek strukturnya: functions/api/projects.js harus ada di root repo (sejajar dengan folder public, bukan di dalamnya), lalu deploy ulang.'
        ]];
      }
      return ['bad', 'Fungsi error (kode ' + status + ')', [
        'Fungsi ditemukan tetapi gagal dijalankan.',
        'Buka Cloudflare, Workers & Pages, project ini, tab Deployments, lalu lihat log Functions.'
      ]];
    }

    if (data.ok === true){
      var names = (data.projects || []).map(function(p){ return p.name; }).join(', ');
      return ['ok', 'Sinkron berhasil: ' + data.count + ' project', [
        names,
        'Kalau halaman utama masih menampilkan jumlah lain, muat ulang tanpa cache atau buka lewat tab incognito.'
      ]];
    }

    if (typeof data.sourceStatus === 'undefined'){
      return ['warn', 'Fungsi masih versi lama', [
        'Respons belum memuat sourceStatus, jadi penyebabnya belum bisa dibaca.',
        'Pastikan functions/api/projects.js terbaru sudah di-commit dan deploy selesai.'
      ]];
    }

    var code = data.sourceStatus;
    if (code === 0){
      return ['bad', 'Fungsi tidak bisa menghubungi HidzProject', [
        'Koneksi gagal atau kehabisan waktu (kode 0).',
        'Coba periksa lagi beberapa saat. Kalau tetap sama, pastikan hidzproject.my.id terbuka dari browser.'
      ]];
    }
    if (code === 403 || code === 429 || code === 503){
      return ['bad', 'HidzProject memblokir permintaan server (kode ' + code + ')', [
        'Situsnya hidup, tetapi firewall menolak permintaan dari fungsi ini.',
        'Penyebab umum: Bot Fight Mode di Cloudflare hidzproject.my.id, atau Bot Protection di Firewall Vercel. Longgarkan salah satunya lalu periksa lagi.'
      ]];
    }
    if (code === 200){
      return ['warn', 'Halaman HidzProject terbaca, datanya tidak dikenali', [
        'Server menjawab 200 tetapi data project tidak ditemukan di dalamnya.',
        'Kemungkinan halaman yang diterima bukan halaman utama HidzProject (misalnya halaman pemeriksaan browser).'
      ]];
    }
    return ['bad', 'HidzProject menjawab kode ' + code, [
      'Fungsi tersambung tetapi tidak mendapat halaman yang diharapkan.'
    ]];
  }

  function run(){
    show('', 'Memeriksa…', []);
    rawEl.textContent = '-';
    fetch('/api/projects', { cache: 'no-store' }).then(function(res){
      var type = res.headers.get('content-type') || '';
      return res.text().then(function(text){
        var head = 'HTTP ' + res.status + '  ' + type + '\n\n';
        rawEl.textContent = head + (text.length > 1500 ? text.slice(0, 1500) + '\n…' : text);
        var result = diagnose(res.status, type, text);
        show(result[0], result[1], result[2]);
      });
    }).catch(function(){
      rawEl.textContent = 'Permintaan gagal sebelum ada jawaban.';
      show('bad', 'Tidak bisa menghubungi situs', ['Periksa koneksi internetmu, lalu coba lagi.']);
    });
  }

  document.getElementById('again').addEventListener('click', run);
  run();
})();
</script>
</body>
</html>
